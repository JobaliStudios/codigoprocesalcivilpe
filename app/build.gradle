plugins {
    id 'com.android.application'
}

def localSigningProperties = new Properties()
def localSigningPropertiesFile = rootProject.file("keystore.properties")
if (localSigningPropertiesFile.exists()) {
    localSigningPropertiesFile.withInputStream { stream ->
        localSigningProperties.load(stream)
    }
}

// CI can provide environment variables. Developers can use either
// ~/.gradle/gradle.properties or the ignored root keystore.properties file.
def signingValue = { String name ->
    System.getenv(name)
            ?: project.findProperty(name)?.toString()
            ?: localSigningProperties.getProperty(name)
}

def releaseStoreFile = signingValue("RELEASE_STORE_FILE")
def releaseStorePassword = signingValue("RELEASE_STORE_PASSWORD")
def releaseKeyAlias = signingValue("RELEASE_KEY_ALIAS")
def releaseKeyPassword = signingValue("RELEASE_KEY_PASSWORD")
def hasReleaseSigningConfig = [
        releaseStoreFile,
        releaseStorePassword,
        releaseKeyAlias,
        releaseKeyPassword
].every { value -> value != null && !value.trim().isEmpty() }

android {
    namespace 'com.jobalistudios.codigoprocesalcivilpe'
    compileSdk 36

    defaultConfig {
        applicationId 'com.jobalistudios.codigoprocesalcivilpe'
        minSdk 30
        targetSdk 36
        versionCode 10
        versionName "1.05"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (hasReleaseSigningConfig) {
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigningConfig) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding true
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    def releasePackageRequested = taskGraph.allTasks.any { task ->
        task.project == project && (
                task.name == "packageRelease"
                        || task.name == "signReleaseBundle"
        )
    }
    if (releasePackageRequested && !hasReleaseSigningConfig) {
        throw new GradleException(
                "Release signing is not configured. Set RELEASE_STORE_FILE, "
                        + "RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS and RELEASE_KEY_PASSWORD "
                        + "in the ignored keystore.properties file, ~/.gradle/gradle.properties "
                        + "or environment variables."
        )
    }
}

dependencies {
    def nav_version = "2.8.9"
    implementation "androidx.navigation:navigation-fragment:$nav_version"
    implementation "androidx.navigation:navigation-ui:$nav_version"
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-intents:3.6.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    implementation 'com.google.android.gms:play-services-ads:24.2.0'
    implementation 'com.google.android.ump:user-messaging-platform:3.1.0'
    implementation 'com.google.code.gson:gson:2.10.1'



}

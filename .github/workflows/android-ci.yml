name: Android CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Validar y compilar
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Comprobar alcance histórico de Fase 4
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'maintenance/fase4-')
        run: python3 tools/check_phase4_scope.py

      - name: Validar archivos y credenciales versionados
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Test-Placeholder([string]$Value) {
            if ([string]::IsNullOrWhiteSpace($Value)) { return $true }
            $trimmed = $Value.Trim()
            if ($trimmed -match '^<[^>]+>$') { return $true }
            if ($trimmed -match '^\$\{[^}]+\}$') { return $true }
            return $trimmed -match '(?i)(change.?me|replace.?me|example|sample|dummy|your[-_ ]|placeholder|path[/\\]to)'
          }

          function Add-Issue(
            [System.Collections.Generic.List[string]]$Issues,
            [string]$Path,
            [string]$Reason
          ) {
            $description = "${Path} (${Reason})"
            if (-not $Issues.Contains($description)) {
              $Issues.Add($description)
            }
          }

          $issues = [System.Collections.Generic.List[string]]::new()
          $forbiddenPath = '(?i)(^|/)(keystore\.properties|[^/]+\.(apk|aab|jks|keystore|p12|pfx))$'
          $trackedFiles = @(& git -c core.quotePath=false ls-files)
          if ($LASTEXITCODE -ne 0) {
            throw 'No se pudo obtener la lista de archivos versionados.'
          }

          foreach ($relativePath in $trackedFiles) {
            $normalizedPath = ([string]$relativePath).Replace('\', '/')
            if ($normalizedPath -match $forbiddenPath) {
              Add-Issue $issues $normalizedPath 'archivo prohibido en Git'
              continue
            }

            if (-not (Test-Path -LiteralPath $relativePath -PathType Leaf)) { continue }
            try {
              $content = [System.IO.File]::ReadAllText((Resolve-Path -LiteralPath $relativePath))
            } catch {
              continue
            }

            if ($content -match '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----') {
              Add-Issue $issues $normalizedPath 'clave privada incrustada'
            }

            $signingProperties = [regex]::Matches(
              $content,
              '(?im)^\s*(RELEASE_STORE_FILE|RELEASE_STORE_PASSWORD|RELEASE_KEY_ALIAS|RELEASE_KEY_PASSWORD)\s*[:=]\s*(.*?)\s*$'
            )
            foreach ($property in $signingProperties) {
              if (-not (Test-Placeholder $property.Groups[2].Value)) {
                Add-Issue $issues $normalizedPath "valor real para $($property.Groups[1].Value)"
              }
            }

            $hardcodedGradleValues = [regex]::Matches(
              $content,
              '(?im)\b(storeFile|storePassword|keyAlias|keyPassword)\s+(["''])(.*?)\2'
            )
            foreach ($hardcoded in $hardcodedGradleValues) {
              if (-not (Test-Placeholder $hardcoded.Groups[3].Value)) {
                Add-Issue $issues $normalizedPath 'credencial de firma escrita directamente'
              }
            }

            $genericCredentials = [regex]::Matches(
              $content,
              '(?im)^\s*(password|passwd|secret|api[_-]?key|access[_-]?token|client[_-]?secret)\s*[:=]\s*(.*?)\s*$'
            )
            foreach ($credential in $genericCredentials) {
              if (-not (Test-Placeholder $credential.Groups[2].Value)) {
                Add-Issue $issues $normalizedPath "posible credencial: $($credential.Groups[1].Value)"
              }
            }

            $knownSecretPatterns = @(
              @{ Name = 'token de GitHub'; Pattern = '(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{20,}' },
              @{ Name = 'token de GitHub'; Pattern = 'github_pat_[A-Za-z0-9_]{20,}' },
              @{ Name = 'clave de API de Google'; Pattern = 'AIza[0-9A-Za-z_-]{35}' },
              @{ Name = 'clave de acceso AWS'; Pattern = 'AKIA[0-9A-Z]{16}' },
              @{ Name = 'token de Slack'; Pattern = 'xox[baprs]-[0-9A-Za-z-]{10,}' },
              @{ Name = 'token de API'; Pattern = 'sk-[A-Za-z0-9]{20,}' }
            )
            foreach ($knownSecret in $knownSecretPatterns) {
              if ($content -match $knownSecret.Pattern) {
                Add-Issue $issues $normalizedPath $knownSecret.Name
              }
            }
          }

          if ($issues.Count -gt 0) {
            Write-Host 'Se encontraron archivos o posibles credenciales sensibles:'
            foreach ($issue in $issues) {
              Write-Host " - $issue"
            }
            throw "La validación de seguridad encontró $($issues.Count) problema(s). Los valores no se muestran."
          }

          Write-Host 'Validación correcta: no hay binarios, claves ni credenciales reales versionadas.'

      - name: Validar sincronización de articles.json
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./tools/generate_articles.ps1

          & git diff --quiet -- app/src/main/assets/articles.json
          if ($LASTEXITCODE -ne 0) {
            & git diff --stat -- app/src/main/assets/articles.json
            throw 'articles.json no está sincronizado. Ejecute tools/generate_articles.ps1 y confirme el archivo generado.'
          }

          Write-Host 'articles.json está sincronizado.'

      - name: Validar integridad del banco de preguntas y referencias al CPC
        run: |
          python3 tools/validate_quiz_bank.py
          python3 -m unittest discover -s tools -p 'test_validate_quiz_bank.py' -v

      - name: Validar fichas de descubrimiento y continuidad jurídica
        run: |
          python3 tools/validate_discovery_assets.py
          python3 -m unittest discover -s tools -p 'test_validate_discovery_assets.py' -v

      - name: Validar preflight de la candidata 1.08 sin autorizar publicación
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/1.08-')
        run: |
          python3 tools/validate_release_candidate.py
          python3 -m unittest discover -s tools -p 'test_validate_release_candidate.py' -v

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Habilitar Gradle wrapper
        run: chmod +x ./gradlew

      - name: Ejecutar pruebas unitarias
        run: ./gradlew test --console=plain

      - name: Ejecutar Android Lint
        run: ./gradlew lint --console=plain

      - name: Compilar debug
        run: ./gradlew assembleDebug --console=plain

      - name: Validar variante release sin firmar
        run: ./gradlew testReleaseUnitTest minifyReleaseWithR8 --console=plain

  release-device-regression:
    name: Regresión instrumentada (emulador)
    if: github.event_name == 'pull_request' && (startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'maintenance/fase4-'))
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Habilitar Gradle wrapper
        run: chmod +x ./gradlew

      - name: Permitir aceleración KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Ejecutar pruebas instrumentadas Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            # La ventana del emulador puede quedar bloqueada o detrás del launcher.
            adb shell svc power stayon true
            adb shell input keyevent 224
            adb shell wm dismiss-keyguard
            adb shell input keyevent 82
            adb shell input keyevent 3
            adb shell settings put system screen_off_timeout 1800000
            adb shell cmd statusbar collapse
            echo "Ventana enfocada antes de instrumentación:"
            adb shell dumpsys window | grep -E 'mCurrentFocus|mFocusedApp|mTopFocusedDisplayId' || true
            ./gradlew connectedDebugAndroidTest --console=plain || (echo "Diagnóstico de foco del emulador tras las pruebas:"; adb shell dumpsys window | grep -E 'mCurrentFocus|mFocusedApp|mTopFocusedDisplayId|mInputMethodTarget' || true; adb shell dumpsys activity activities | grep -E 'topResumedActivity|mResumedActivity|mFocusedRootTask' || true; adb exec-out screencap -p > emulator-instrumentation-failure.png || true; exit 1)

      - name: Conservar evidencia de regresión en emulador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regresion-android15-instrumentacion
          path: |
            emulator-instrumentation-failure.png
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: ignore

